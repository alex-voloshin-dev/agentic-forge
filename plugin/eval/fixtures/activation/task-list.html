<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Task Store</title></head>
<body>
  <h1>Tasks</h1>
  <form id="add">
    <input name="title" placeholder="New task">
    <select name="priority"><option>1</option><option>3</option><option selected>5</option></select>
    <button type="submit">Add</button>
  </form>
  <ul id="tasks">
    <li data-priority="1">ship the release</li>
    <li data-priority="5">tidy the README</li>
  </ul>
  <p id="empty" hidden>Nothing to do. Add a task above.</p>
</body>
</html>
