name: scheduled

# Headless cadence (Stage 7): the external clock for the declarative job registry in
# agentic_forge.schedule. Runs the *due* jobs (kb-maintenance, deploy-digest, audit-digest); the
# jobs are deterministic and need no model token. Real cadence needs the last-run state to persist
# across runs (a target repo commits .agentic-forge/ or caches it); in this ephemeral checkout the
# run is a wiring smoke. Adapt this workflow in a target repo that uses the plugin.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  scheduled:
    name: Run due scheduled jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: List due jobs (dry-run)
        run: python plugin/bin/run_scheduled.py --dry
      - name: Run due scheduled jobs
        run: python plugin/bin/run_scheduled.py
