name: eval (Tier 1-3)

# The model-backed tiers run through the `claude` CLI authenticated with a Claude subscription
# token (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), so they bill to the subscription
# rather than a per-token API key. Do NOT set ANTHROPIC_API_KEY here — it takes precedence over the
# subscription token. See docs/eval-runbook.md.
#
# Three jobs, because "measured" and "affordable" are not the same size (ADR 0083):
#   wiring   — every event, no credentials. Contracts, prompts and fixtures resolve.
#   trigger  — Tier-1 routing, WEEKLY. ~17 skills x 5 runs; this is the routing guard CLAUDE.md
#              promises, and the listing budget makes it the regression that actually bites.
#   quality  — Tier-2 + Tier-3, ON DEMAND only. ~360 full agent sessions plus five E2E chains:
#              hours of model time, past a 6h GitHub job on its own, and not weekly work.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for the eval runs"
        required: false
        default: "claude-opus-4-8"
      tiers:
        description: "Which tiers to run"
        required: false
        default: "all"
        type: choice
        options: ["all", "trigger-only", "builtins-condition", "activation"]
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC — Tier-1 only
  pull_request:
    types: [labeled]

env:
  EVAL_MODEL: ${{ github.event.inputs.model || 'claude-opus-4-8' }}

jobs:
  # Needs no credentials, so it runs on forks and on every triggering event: a mis-wired contract,
  # an unresolvable fixture or a broken role prompt fails here in a minute, for free.
  wiring:
    name: Wiring (dry-run, no auth)
    if: github.event_name != 'pull_request' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Python deps)
        run: pip install -e ".[dev]"
      - name: Agent Tier-2 wiring
        run: python dev/run_agent_evals.py --runner dry
      - name: Skill Tier-1 wiring
        run: python dev/run_tier1_evals.py --runner dry
      - name: Skill Tier-2 wiring
        run: python dev/run_skill_evals.py --runner dry
      - name: Tier-3 wiring — spine + domain scenarios
        run: python dev/run_spine_e2e.py --runner dry --scenario all
      - name: Say what this measured
        if: ${{ always() }}
        run: echo "**Wiring only** — contracts, prompts and fixtures resolve. NO threshold was checked." >> "$GITHUB_STEP_SUMMARY"

  # Tier-1 on the weekly cron. The router listing is at its context ceiling, so one description
  # edit can break a neighbour's routing; this is the regression worth catching on a schedule.
  trigger:
    name: Tier-1 trigger (routing)
    if: github.event_name != 'pull_request' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # A weekly guard that cannot measure must not report success. For months this cron went green
      # in ~28s with every model-backed step skipped for a missing token, while the field bundle
      # carried Tier-1 recall BELOW the bar for four skills (ADR 0082).
      - name: The weekly run must actually run (token present)
        if: ${{ github.event_name == 'schedule' && env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: |
          echo "::error title=Weekly eval cannot measure::CLAUDE_CODE_OAUTH_TOKEN is not set, so the Tier-1 routing run would be SKIPPED and this job would report success having checked no threshold. Fix: run 'claude setup-token', then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN'."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (Python deps + Claude Code CLI)
        run: |
          pip install -e ".[dev]"
          npm install -g @anthropic-ai/claude-code

      # Classifies each skill's trigger prompts against the LIVE listing, scored as the mean
      # per-prompt routing rate, gated recall/specificity >= 0.9 (ADR 0016/0026). Skipped without
      # the token — on a fork, or a dispatch from someone who has none.
      - name: Skill Tier-1 trigger (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && github.event.inputs.tiers != 'builtins-condition' && github.event.inputs.tiers != 'activation' }}
        run: python dev/run_tier1_evals.py --runner claude --model "$EVAL_MODEL"

      # ADR 0086's measurement, on demand: the same prompts against the listing a live session
      # actually shows — Claude Code's built-ins beside ours, ours namespaced. Not the gate.
      - name: Skill Tier-1 with the built-in listing (condition, not the gate)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && github.event.inputs.tiers == 'builtins-condition' }}
        run: python dev/run_tier1_evals.py --runner claude --model "$EVAL_MODEL" --with-builtins

      # Tier-1b, on demand (ADR 0088/0092): does a live session with the plugin loaded invoke the
      # skill unprompted? Each prompt runs in a fresh fixture repo. A measurement — no gate until
      # a threshold is calibrated against the polished-stand baseline (ADR 0092).
      # Gated on the rate POOLED over the run's 84 prompts, not per skill: at 4-9 prompts a skill a
      # per-skill floor flakes or misses (ADR 0093). 0.80 sits five sigma under the 0.940 baseline,
      # fails the note-off regime (0.571) with certainty and a drop to 0.75 seven runs in eight.
      - name: Skill Tier-1b activation (pooled gate, on demand)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && github.event.inputs.tiers == 'activation' }}
        run: python dev/run_activation_evals.py --runner claude --model "$EVAL_MODEL" --min-activation 0.80
      - name: Say what this measured
        if: ${{ always() }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Measured: **Tier-1 routing** on \`$EVAL_MODEL\` — recall/specificity gated at 0.9." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Skipped** — no subscription token, so no threshold was checked." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The expensive half: ~95 role sessions + ~265 skill sessions + five Tier-3 chains. On demand
  # only — a weekly run of this would not fit a 6h job, and these tiers move with a release, not
  # with the calendar.
  quality:
    name: Tier-2 + Tier-3 (quality + E2E)
    # A POSITIVE list. The first cut excluded `trigger-only` and so let `builtins-condition` launch
    # the whole ~360-session suite (ADR 0086's first run had to be cancelled mid-flight).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tiers == 'all' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (Python deps + Claude Code CLI)
        run: |
          pip install -e ".[dev]"
          npm install -g @anthropic-ai/claude-code

      # Each role on its fixtures, graded by the grader role, aggregated and gated mean-stddev.
      - name: Agent Tier-2 quality (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_agent_evals.py --runner claude --model "$EVAL_MODEL"

      # Knowledge skills (*-patterns / engineering-standards) run as the software-engineer with
      # them loaded; deep-review / skill-factory run directly. A full coding session per case x N.
      - name: Skill Tier-2 quality (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_skill_evals.py --runner claude --model "$EVAL_MODEL"

      # Carry a feature through a scenario's phases on an isolated fixture copy, checking
      # deterministic per-phase artifacts and outcomes.
      - name: Spine Tier-3 E2E (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_spine_e2e.py --runner claude --model "$EVAL_MODEL" --scenario spine

      - name: Domain Tier-3 chains (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: >-
          python dev/run_spine_e2e.py --runner claude --model "$EVAL_MODEL"
          --scenario quality-gate --scenario ops-incident
          --scenario product-inception --scenario market-brief

      - name: Say what this measured
        if: ${{ always() }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Measured: **Tier-2 quality** (agents + skills) and **Tier-3 E2E** on \`$EVAL_MODEL\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Skipped** — no subscription token, so no threshold was checked." >> "$GITHUB_STEP_SUMMARY"
          fi
