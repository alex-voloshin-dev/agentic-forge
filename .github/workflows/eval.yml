name: eval (Tier 1-2)

# LLM-judged tiers are cost-gated: run on demand or when a PR is labelled "eval".
# The real agent Tier-2 runs through the `claude` CLI authenticated with a Claude
# subscription token (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), so it bills to the
# subscription rather than a per-token API key. Do NOT set ANTHROPIC_API_KEY here — it takes
# precedence over the subscription token. See docs/eval-runbook.md.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for the eval runs"
        required: false
        default: "claude-opus-4-8"
  pull_request:
    types: [labeled]

jobs:
  quality:
    name: Tier 1-2 (trigger + quality)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVAL_MODEL: ${{ github.event.inputs.model || 'claude-opus-4-8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (Python deps + Claude Code CLI)
        run: |
          pip install -e ".[dev]"
          npm install -g @anthropic-ai/claude-code

      # Always verify the agent Tier-2 wiring — contracts, role prompts, and fixtures must
      # resolve. Needs no credentials, so it runs even on forks without the secret.
      - name: Agent Tier-2 wiring (dry-run, no auth)
        run: python dev/run_agent_evals.py --runner dry

      # Real Tier-2 for the engine roles via the Claude subscription: runs each role on its
      # fixtures, grades with the grader role, aggregates with agentic_forge.benchmark, and
      # gates with agentic_forge.gate. Skipped when the subscription token is absent.
      - name: Agent Tier-2 quality (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_agent_evals.py --runner claude --model "$EVAL_MODEL"

      - name: Skill Tier-1 wiring (dry-run, no auth)
        run: python dev/run_tier1_evals.py --runner dry

      # Real Tier-1 for the on-listing router skills via the Claude subscription: classifies each
      # skill's trigger prompts against the LIVE listing, majority-of-N, and gates
      # recall/specificity >= 0.9 with agentic_forge.gate (ADR 0016). Skipped without the token.
      - name: Skill Tier-1 trigger (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_tier1_evals.py --runner claude --model "$EVAL_MODEL"

      - name: Skill Tier-2 wiring (dry-run, no auth)
        run: python dev/run_skill_evals.py --runner dry

      # Real Tier-2 for the tier2 skills via the Claude subscription: knowledge skills
      # (*-patterns / engineering-standards) run as the software-engineer with them loaded,
      # deep-review / skill-factory run directly; each graded, aggregated, gated mean-stddev
      # >= 0.8 (ADR 0017). The most expensive eval (a full coding session per case x N), so it is
      # the last cost-gated step; skipped without the token.
      - name: Skill Tier-2 quality (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_skill_evals.py --runner claude --model "$EVAL_MODEL"

      - name: Tier-3 wiring (dry-run, no auth) — spine + domain scenarios
        run: python dev/run_spine_e2e.py --runner dry --scenario all

      # Real Tier-3 end-to-end via the Claude subscription: carry a feature through a scenario's
      # phases on an isolated fixture copy, checking deterministic per-phase artifacts/outcomes.
      # The heaviest evals; skipped without the token.
      - name: Spine Tier-3 E2E (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_spine_e2e.py --runner claude --model "$EVAL_MODEL" --scenario spine

      - name: Domain Tier-3 chains (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: >-
          python dev/run_spine_e2e.py --runner claude --model "$EVAL_MODEL"
          --scenario quality-gate --scenario ops-incident
          --scenario product-inception --scenario market-brief
