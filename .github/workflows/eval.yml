name: eval (Tier 1-2)

# LLM-judged tiers are cost-gated: run on demand or when a PR is labelled "eval".
# The real agent Tier-2 runs through the `claude` CLI authenticated with a Claude
# subscription token (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), so it bills to the
# subscription rather than a per-token API key. Do NOT set ANTHROPIC_API_KEY here — it takes
# precedence over the subscription token. See docs/eval-runbook.md.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for the eval runs"
        required: false
        default: "claude-sonnet-4-6"
  pull_request:
    types: [labeled]

jobs:
  quality:
    name: Tier 1-2 (trigger + quality)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVAL_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (Python deps + Claude Code CLI)
        run: |
          pip install -e ".[dev]"
          npm install -g @anthropic-ai/claude-code

      # Always verify the agent Tier-2 wiring — contracts, role prompts, and fixtures must
      # resolve. Needs no credentials, so it runs even on forks without the secret.
      - name: Agent Tier-2 wiring (dry-run, no auth)
        run: python dev/run_agent_evals.py --runner dry

      # Real Tier-2 for the engine roles via the Claude subscription: runs each role on its
      # fixtures, grades with the grader role, aggregates with agentic_forge.benchmark, and
      # gates with agentic_forge.gate. Skipped when the subscription token is absent.
      - name: Agent Tier-2 quality (subscription via claude)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python dev/run_agent_evals.py --runner claude --model "$EVAL_MODEL"

      # Skill Tier-1/Tier-2 still flow through the skill-creator loop (skills only). Wire it
      # here, aggregate with agentic_forge.benchmark, and gate with agentic_forge.gate.
      - name: Skill Tier-1/2 (skill-creator) — TODO
        run: |
          echo "Wire skill-creator runs for skills here, then benchmark + gate."
          echo "Agents are covered by the agent Tier-2 steps above (see docs/eval-runbook.md)."
