[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-forge"
version = "0.0.1"
description = "Tooling library and validators for the agentic-forge Claude Code plugin."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "types-jsonschema",
]
# Only needed for the optional per-token path (dev/run_agent_evals.py --runner api). The
# recommended --runner claude uses the `claude` CLI (subscription auth) and needs no SDK.
# Kept out of the default/dev install so the Tier-0 gate stays dependency-light.
eval = [
    "anthropic>=0.39",
]

# The importable package lives at plugin/lib/agentic_forge (not a flat top-level dir),
# so tell setuptools exactly what to package and where the root is. This makes
# `pip install -e .` work and avoids flat-layout auto-discovery picking up dev/ and plugin/.
[tool.setuptools]
package-dir = { "" = "plugin/lib" }
packages = ["agentic_forge"]

[tool.pytest.ini_options]
pythonpath = ["plugin/lib"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["plugin/lib", "dev", "tests"]
# Eval fixtures are test DATA, not project source (they may hold intentionally imperfect code
# for a reviewer to find, or a target repo with its own conventions). Don't lint them.
extend-exclude = ["plugin/eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "plugin/lib"
strict = true
warn_unused_ignores = true

# The Anthropic SDK is an optional (eval-only) dependency and ships no stubs; don't fail
# Tier-0 type-checking when it is absent.
[[tool.mypy.overrides]]
module = ["anthropic"]
ignore_missing_imports = true

[tool.coverage.run]
# Gate the dev/ eval runners too, not just the library — their aggregation/exit-code logic
# decides ship/no-ship and must not regress uncovered (ultra-review MAJOR).
source = ["agentic_forge", "dev"]
# Note: on some bind-mounted filesystems coverage cannot delete its parallel data
# files. If you hit "Operation not permitted", set COVERAGE_FILE to a local path,
# e.g. COVERAGE_FILE=/tmp/.coverage pytest --cov.

[tool.coverage.report]
# Tier-0 coverage floor (CLAUDE.md principle 5), enforced on the aggregate of the measured
# source above so local `pytest --cov` and CI agree. The real number sits far higher.
fail_under = 80
